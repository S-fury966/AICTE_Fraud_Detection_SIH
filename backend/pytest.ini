[pytest]
testpaths = tests
pythonpath = .
markers =
    ocr: runs the real OCR engine (slower; deselect with -m "not ocr")
    llm: calls a real LLM API (costs money; needs a key; deselect with -m "not llm")
    qr: decodes real images with opencv/zxing (slower; deselect with -m "not qr")
    slow: generates or runs the whole evaluation dataset (minutes; deselect with -m "not slow")
