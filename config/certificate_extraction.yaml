# Certificate field extraction settings.
#
# The LLM reads and reports; the checks below are what the code then enforces.
# Bump `config_version` whenever a value changes: it is stamped onto every
# result alongside the prompt version.
config_version: certificate-extraction-v4

prompt:
  # Resolves to backend/app/llm/prompts/<name>.<version>.md
  name: certificate_extraction
  version: v1

llm:
  # Name registered in backend/app/llm/registry.py
  provider: groq
  # Used only when the provider above cannot run at all (no key, quota of
  # zero). `rules` is the offline label reader in app/llm/rules_provider.py: no
  # network, no model, same JSON contract, and its values pass the same snippet
  # guard as a model's. The run records which provider actually answered, so a
  # reading made by the fallback is never mistaken for a model's. Set to null
  # to make a missing key fail the stage instead.
  fallback_provider: rules
  # Which provider-call failures the offline reader stands in for. Matched on
  # the failure's category, not its message. Remove a category to make that
  # failure hard-fail the stage instead of reading offline - the list is
  # authoritative, nothing here is decorative.
  #
  # Not listed, and deliberately not governed by this list: a provider that
  # cannot run at all - no key, or a request allowance of zero. The offline
  # reader always stands in for those when it is configured, because that is
  # the demo-without-a-key contract, not a transport decision.
  fallback_on:
    - timeout          # connection opened but no response in the read window
    - connection_error # refused, reset or unresolved - the network is down
    - server_error     # the endpoint returned 5xx
    - rate_limited     # still 429 after the retry budget
    - auth_rejected    # 401/403 - the key was refused
    - model_or_endpoint_not_found  # 404 - wrong model or base_url
    - other_transport  # any other non-200, or a reply that was not a completion
  # When the network is down, every document would otherwise wait out a
  # connection attempt before reading offline. After this many consecutive
  # transport failures the primary is skipped for cool_down_seconds and the
  # offline reader is used straight away; a later success closes it again. The
  # audit records when a document skipped the primary for this reason. State is
  # in memory, per process.
  circuit_breaker:
    enabled: true
    consecutive_failures: 2
    cool_down_seconds: 60
  # Attempts after the first one, when the response fails schema validation.
  max_retries: 1
  # Sampling temperature, passed to providers that accept it. 0 is as close to
  # repeatable as a hosted model gets; the real guarantee of consistency is
  # the deterministic validation applied to whatever comes back.
  temperature: 0
  # Each block below is the same OpenAI-compatible client with a different
  # endpoint, model and key. Adding another free tier is a block here, not
  # code. Shared keys:
  #   json_mode  - ask the server to guarantee the body parses as JSON. Our
  #                schema validation still runs: this constrains syntax, not
  #                contents.
  #   rate_limit_* - free tiers rate limit hard, so a 429 is routine rather
  #                than a fault. The provider waits and retries on its own,
  #                separate from the schema retries above, honouring the
  #                server's Retry-After when it sends one.
  providers:
    groq:
      base_url: https://api.groq.com/openai/v1
      # Groq serves open-weight models. gpt-oss-120b is the strongest one on
      # the key's model list and answers field extraction reliably; it is a
      # reasoning model, so it spends more output tokens than its size
      # suggests. qwen/qwen3.8-27b is the cheaper, terser alternative.
      model: openai/gpt-oss-120b
      max_tokens: 4096
      api_key_env: GROQ_API_KEY
      json_mode: true
      timeout_seconds: 60
      # A separate, short connect timeout: a network that will not open a
      # connection in this many seconds is down, and the offline reader should
      # take over rather than the whole demo stalling on the full read window.
      connect_timeout_seconds: 5
      rate_limit_retries: 3
      rate_limit_backoff_seconds: 2.0
    rules:
      model: label-rules-v1
      # Printed labels, per field. Matched at the start of a line, longest
      # first, case-insensitive. The value is the rest of that line, or the
      # next non-empty line for a two-column table.
      labels:
        institution_name: ["Name of Institution", "Institution"]
        certificate_number: ["Certificate Number", "Certificate No.", "Certificate No", "Reference No.", "Reference Number"]
        issuing_body: ["Issuing Body", "Issuing Authority", "Issued By"]
        programme: ["Programme Accredited", "Accredited Programme", "Programmes", "Programme"]
        accreditation_status_or_grade: ["Assessment Grade", "Grade Awarded", "Grade", "Outcome"]
        issue_date: ["Date of Issue", "Issued On", "Issue Date"]
        valid_from: ["Valid From", "Effective From"]
        valid_to: ["Valid Until", "Valid To", "Effective Until"]
        signatory_name: ["Authorised Signatory", "Signatory", "Signed"]
    mistral:
      base_url: https://api.mistral.ai/v1
      model: mistral-small-latest
      max_tokens: 4096
      api_key_env: MISTRAL_API_KEY
      json_mode: true
      timeout_seconds: 60
      rate_limit_retries: 3
      rate_limit_backoff_seconds: 2.0

snippet_validation:
  # The hallucination guard: a value survives only if its source_snippet is
  # actually present in the page text.
  collapse_whitespace: true
  ignore_case: true
  # Below exact containment, the closest window in the page text must reach
  # this similarity ratio. 1.0 would demand an exact match after
  # normalisation; a little slack absorbs OCR noise and stray punctuation.
  min_similarity: 0.92
  # Minimum snippet length worth checking. A very short snippet matches
  # almost anything and proves nothing.
  min_snippet_chars: 8
  # If the snippet is absent from the page the model claimed but present on
  # another page, keep the value and correct the page number instead of
  # discarding it.
  allow_page_correction: true

  # Fields where the VALUE itself must appear verbatim in the page text, not
  # merely inside a snippet that fuzzy-matches.
  #
  # Fuzzy snippet matching exists to absorb OCR noise in prose, but on an
  # identifier it is dangerous: a certificate number altered by one digit
  # still scores ~0.97 against the original line and would pass. These are
  # the fields where a single character changes the meaning, so they are
  # checked by exact containment after normalisation. Prose fields such as
  # institution_name stay fuzzy, because OCR routinely mangles them.
  exact_value_fields:
    - certificate_number
    - accreditation_status_or_grade
    - issue_date
    - valid_from
    - valid_to

dates:
  # Indian convention: 03/04/2025 is 3 April, not 4 March.
  day_first: true
  min_year: 1900
  max_year: 2100

consistency:
  # Reference date for the expiry report. null means "today", in UTC.
  # Pin it to a fixed date for reproducible demos and evaluation runs.
  as_of: null

output:
  # Raw model responses are kept in the audit block for review. Set false to
  # drop them if the output is going somewhere that should not hold them.
  include_raw_responses: true
